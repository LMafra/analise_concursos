# Roda no GitHub (LMafra/analise_concursos). Os testes da GUI usam a fixture `user` da NiceGUI, sem navegador.
name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      NO_COLOR: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Dependências
        run: uv sync --locked --extra gui

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Testes
        run: uv run pytest

      - name: Smoke de ponta a ponta (uvx num projeto temporário)
        run: uv run --no-project python scripts/smoke.py uvx --python ${{ matrix.python }} --from "${{ github.workspace }}" concurso-analise

  tec-erros:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tec-erros
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Testes (inclui o contrato em tests/contrato_tec)
        run: node --test
      - name: Build
        run: node scripts/build.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Imagem
        run: docker build -t concurso-analise .
      - name: Doctor e smoke no container
        run: |
          docker run --rm -v /tmp:/dados concurso-analise doctor
          docker run --rm -v "$PWD/scripts:/s:ro" --entrypoint python concurso-analise /s/smoke.py
