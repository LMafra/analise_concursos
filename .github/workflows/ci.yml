# Roda no GitHub (LMafra/analise_concursos). Os testes da GUI usam a fixture `user` da NiceGUI, sem navegador.
name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      NO_COLOR: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Dependências
        run: uv sync --locked --extra gui

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Testes
        run: uv run pytest

      - name: Smoke de ponta a ponta (uvx num projeto temporário)
        run: uv run --no-project python scripts/smoke.py uvx --python ${{ matrix.python }} --from "${{ github.workspace }}" gabarito-vivo

  cve:
    name: cve / pip-audit
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.0'
          python-version: '3.12'
          enable-cache: true

      - name: Dependências
        run: uv sync --locked --extra gui --extra llm --extra pci

      - name: Exportar requirements do lock
        run: uv export --frozen --no-dev --no-emit-project --extra gui --extra llm --extra pci -o /tmp/requirements-audit.txt

      - name: pip-audit
        run: uv run --no-project python scripts/auditar_cve.py /tmp/requirements-audit.txt

  arquitetura:
    name: arquitetura / Python 3.12
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.0'
          python-version: '3.12'
          enable-cache: true

      - name: Dependências
        run: uv sync --locked --group arquitetura --extra gui

      - name: Cobertura (artefato do gate)
        run: uv run --group arquitetura pytest --cov=src/concursos --cov-report=json:coverage.json -q

      - name: Gate de arquitetura
        run: uv run --group arquitetura python scripts/verificar_arquitetura.py

      - name: Contratos import-linter
        run: uv run --group arquitetura lint-imports

  tec-erros:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tec-erros
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Testes (inclui o contrato em tests/contrato_tec)
        run: node --test
      - name: Build
        run: node scripts/build.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Imagem
        run: docker build -t gabarito-vivo .
      - name: Doctor e smoke no container
        run: |
          docker run --rm -v /tmp:/dados gabarito-vivo doctor
          docker run --rm -v "$PWD/scripts:/s:ro" --entrypoint python gabarito-vivo /s/smoke.py
