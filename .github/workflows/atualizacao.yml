# Teste ponta a ponta do atualizador, antes de promover uma release a "latest": instala a versão `de`
# (publicada, com o atualizador da fase 6), roda `upgrade --run` e confere que a versão instalada virou a
# `esperada`. Rode depois de publicar a release nova como prerelease (canal beta) ou como latest (stable).
name: atualizacao

on:
  workflow_dispatch:
    inputs:
      de:
        description: 'tag instalada antes (ex.: v0.7.0b2)'
        required: true
      esperada:
        description: 'versão esperada depois da atualização (ex.: 0.7.0b3)'
        required: true
      canal:
        description: 'canal consultado'
        type: choice
        options: [beta, stable]
        default: beta

permissions:
  contents: read

env:
  DE: ${{ inputs.de }}
  ESPERADA: ${{ inputs.esperada }}
  CANAL: ${{ inputs.canal }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Instalar a versão de partida
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:DE --repo $env:GITHUB_REPOSITORY --pattern '*-windows-x64-setup.exe' --dir antigo
          $setup = Get-ChildItem antigo\*.exe | Select-Object -First 1
          $instalacao = Start-Process $setup.FullName -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER'
          if ($instalacao.ExitCode -ne 0) { throw "setup antigo saiu com $($instalacao.ExitCode)" }

      - name: Atualizar pelo app
        run: |
          $programas = Join-Path $env:LOCALAPPDATA 'Programs'
          function JanelasPossiveis {
            @(
              (Join-Path $programas 'gabarito-vivo\gabarito-vivo.exe'),
              (Join-Path $programas 'concurso-analise\gabarito-vivo.exe'),
              (Join-Path $programas 'concurso-analise\concurso-analise.exe')
            ) | Where-Object { Test-Path $_ }
          }
          $cliAntigo = @(
            (Join-Path $programas 'concurso-analise\concurso-analise-cli.exe'),
            (Join-Path $programas 'gabarito-vivo\gabarito-vivo-cli.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cliAntigo) { throw 'não achei o CLI da versão de partida' }
          & $cliAntigo --yes upgrade --run --canal $env:CANAL
          if ($LASTEXITCODE -ne 0) { throw "upgrade saiu com $LASTEXITCODE" }
          $limite = (Get-Date).AddMinutes(10)
          $versao = $null
          do {
            Start-Sleep -Seconds 10
            Get-Process | Where-Object { $_.ProcessName -match 'setup|gabarito-vivo|concurso-analise' } |
              ForEach-Object { Write-Host "processo: $($_.ProcessName) ($($_.Id))" }
            # O setup ainda pode estar copiando: reavalia o caminho a cada volta (o .exe novo pode
            # aparecer numa pasta diferente da versão de partida).
            $janela = JanelasPossiveis | Select-Object -First 1
            if (-not $janela) { Write-Host 'ainda sem executável instalado'; continue }
            $versao = (Get-Item $janela).VersionInfo.ProductVersion
            Write-Host "versão instalada: $versao ($janela)"
          } while ($versao -ne $env:ESPERADA -and (Get-Date) -lt $limite)
          if ($versao -ne $env:ESPERADA) {
            Get-ChildItem -Recurse $programas -Filter '*.exe' -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName }
            throw "esperava $env:ESPERADA, ficou $versao"
          }
          "Windows: $env:DE -> $versao pelo canal $env:CANAL" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: O app reaberto pelo setup responde
        run: |
          Get-Process gabarito-vivo, concurso-analise -ErrorAction SilentlyContinue | Stop-Process -Force
          $programas = Join-Path $env:LOCALAPPDATA 'Programs'
          $cli = @(
            (Join-Path $programas 'gabarito-vivo\gabarito-vivo-cli.exe'),
            (Join-Path $programas 'concurso-analise\gabarito-vivo-cli.exe'),
            (Join-Path $programas 'concurso-analise\concurso-analise-cli.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cli) { throw 'não achei o CLI da versão nova' }
          & $cli --smoke
          if ($LASTEXITCODE -ne 0) { throw 'smoke da versão nova falhou' }

  linux:
    runs-on: ubuntu-latest
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Baixar a versão de partida
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/Aplicativos
          gh release download "$DE" --repo "$GITHUB_REPOSITORY" --pattern '*-linux-x86_64.AppImage' --dir ~/Aplicativos
          mv ~/Aplicativos/*.AppImage ~/Aplicativos/gabarito-vivo.AppImage
          chmod +x ~/Aplicativos/gabarito-vivo.AppImage

      - name: Atualizar pelo app e conferir
        run: |
          app=~/Aplicativos/gabarito-vivo.AppImage
          "$app" --yes upgrade --run --canal "$CANAL"
          "$app" --smoke | tee smoke.txt
          grep -qx "smoke: versão $ESPERADA" smoke.txt
          echo "Linux: $DE -> $ESPERADA pelo canal $CANAL" >> "$GITHUB_STEP_SUMMARY"
