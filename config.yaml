# Defaults globais da análise. Mudou um limiar? Rode `concursos analisar --forcar`.

# Leituras da folha de resposta com confiança abaixo deste valor ficam com revisar = True.
limiar_confianca: 0.75

# Tópicos com percentual de mérito abaixo deste valor (0–1) em pelo menos dois concursos
# aparecem como consistentemente baixos no comparativo.
limiar_topico_baixo: 0.6

# Pasta do concurso que a nota ponderada e o gap para o corte analisam. Vazio: todos.
# concurso_alvo: tcu_25
