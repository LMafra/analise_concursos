<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>tec-erros</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; width: 320px; color: #1f2933; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  .numeros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; text-align: center; }
  .numeros div { background: #eef1f5; border-radius: 6px; padding: 6px 2px; }
  .numeros b { display: block; font-size: 18px; }
  button { width: 100%; margin: 3px 0; padding: 7px; border: 1px solid #c5ccd6; border-radius: 6px; background: #fff; cursor: pointer; font: inherit; }
  button.perigo { color: #b42318; }
  label { display: block; margin: 8px 0; }
  pre { max-height: 220px; overflow: auto; background: #f7f8fa; padding: 6px; font-size: 11px; white-space: pre-wrap; }
  .nota { color: #616e7c; font-size: 12px; }
</style>
</head>
<body>
<h1>Caderno de erros do TEC</h1>
<div class="numeros">
  <div><b id="erros">0</b>erros</div>
  <div><b id="repetidas">0</b>repetidas</div>
  <div><b id="cadernos">0</b>cadernos</div>
</div>
<button id="baixar">Baixar JSON</button>
<button id="copiar">Copiar JSON</button>
<button id="diagnostico">Diagnóstico desta aba</button>
<label><input type="checkbox" id="historico"> Guardar questões que já aparecem erradas (modo histórico)</label>
<button id="limpar" class="perigo">Limpar tudo</button>
<p id="mensagem" class="nota"></p>
<pre id="relatorio" hidden></pre>
<p class="nota">Aparelho: <span id="dev">?</span>. Os dados ficam só neste navegador; baixe o JSON de vez em quando como backup.</p>
<script src="popup.js"></script>
</body>
</html>
