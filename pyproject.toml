[project]
name = "concursos"
version = "0.1.0"
description = "Análise de desempenho em concursos públicos por disciplina e tópico"
readme = "README.md"
authors = [
    { name = "LMafra", email = "chagas.lucas.mafra@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
concursos = "concursos.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
