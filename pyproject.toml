[project]
name = "concursos"
version = "0.1.0"
description = "Análise de desempenho em concursos públicos por disciplina e tópico"
readme = "README.md"
authors = [
    { name = "LMafra", email = "chagas.lucas.mafra@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
concursos = "concursos.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
analise = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.6",
    "nbconvert>=7.17.2",
    "papermill>=2.7.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "scipy>=1.18.1",
]
dev = [
    "plotly>=7.1.0",
    "pre-commit>=4.7.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
