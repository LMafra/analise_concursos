[project]
name = "concurso-analise"
version = "0.7.0b3"
description = "Gabarito Vivo: correção e análise de provas de concurso por disciplina e tópico"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "LMafra", email = "chagas.lucas.mafra@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "cryptography>=44",
    "markdown-it-py>=3.0",
    "matplotlib>=3.9",
    "numpy>=2.3",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1",
    "packaging>=24",
    "pandas>=2.2",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "plotly>=7.1.0",
    "pyarrow>=18",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "snowballstemmer>=2.2",
    "tomli-w>=1.0",
    "typer>=0.20",
]

[project.optional-dependencies]
llm = ["keyring>=25"]
pci = [
    "mcp>=2.3",
]
gui = [
    "nicegui[native]>=4,<5",
]

[project.scripts]
gabarito-vivo = "concursos.cli:executar"
gabarito-vivo-gui = "concursos.cli:executar_gui"
concurso-analise = "concursos.cli:executar_legado_analise"
concurso-analise-gui = "concursos.cli:executar_gui_legado"
concursos = "concursos.cli:executar_legado"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "concursos"

[dependency-groups]
analise = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.6",
    "nbconvert>=7.17.2",
    "papermill>=2.7.0",
]
dev = [
    "ipython>=8",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "ruff>=0.17.1",
    "syrupy>=6.1.1",
]
empacotamento = [
    "pyinstaller>=6.11",
]
arquitetura = [
    "import-linter>=2.1",
    "interrogate>=1.7",
    "pydeps>=3.0",
    "pytest-cov>=6.0",
    "radon>=6.0",
    "vulture>=2.14",
]

[tool.importlinter]
root_package = "concursos"

[[tool.importlinter.contracts]]
name = "topicos nao importa dicionario_topicos"
type = "forbidden"
source_modules = ["concursos.topicos"]
forbidden_modules = ["concursos.analytics.dicionario_topicos"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "dicionario_topicos nao importa topicos"
type = "forbidden"
source_modules = ["concursos.analytics.dicionario_topicos"]
forbidden_modules = ["concursos.topicos"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "tec_estatisticas nao importa pratica_tec"
type = "forbidden"
source_modules = ["concursos.analytics.tec_estatisticas"]
forbidden_modules = ["concursos.pratica_tec"]
allow_indirect_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: usa uma instância real do open-notebook em OPEN_NOTEBOOK_URL; pulado sem ela",
    "pci_mcp: usa o servidor MCP real da PCI Concursos; pulado sem PCI_MCP_INTEGRACAO=1",
    "open_notebook_real: usa o pacote de estudo montado em ESTUDO_PACOTE; pulado sem ele",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
