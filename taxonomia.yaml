# Taxonomia de disciplinas da análise evolutiva.
#
# Cada chave é uma disciplina canônica, com:
#   bloco: geral | especifico  (usado só na prova única; nas provas divididas o bloco vem da prova:
#                                cg e cb são geral, ce é especifico)
#   nomes: nomes de disciplina como aparecem em analises/<concurso>/questoes.csv. O próprio nome
#          canônico já está incluído.
#
# Um nome de disciplina que não esteja aqui reprova a validação do consolidado, com a lista de nomes.
# Editar este arquivo reconstrói o consolidado na próxima carga.

# --- Bloco geral -------------------------------------------------------------------------------

Língua Portuguesa:
  bloco: geral

Língua Inglesa:
  bloco: geral

Raciocínio Lógico:
  bloco: geral
  nomes:
    - Raciocínio Análitico
    - Raciocínio Lógico Matemático
    - Raciocínio Lógico e Analítico
    - Raciocínio Lógico e Matemático

Atualidades:
  bloco: geral

# CPNU: democracia, políticas públicas, administração pública federal, diversidade, ética.
Conhecimentos Gerais:
  bloco: geral

# Informática básica (sistemas operacionais, Office, navegação). "Informática" da PF mistura noções de
# banco de dados e aprendizado de máquina, mas é a prova de conhecimentos básicos.
Noções de Informática:
  bloco: geral
  nomes:
    - Informática

Direito Administrativo:
  bloco: geral
  nomes:
    - Noções de Direito Administrativo

Direito Constitucional:
  bloco: geral

Direito Penal e Processual Penal:
  bloco: geral
  nomes:
    - Noções de Direito Penal e de Direito Processual Penal

Direitos Humanos:
  bloco: geral

# Cobradas nas provas de conhecimentos básicos do TCU e da PF.
Controle Externo:
  bloco: geral

Auditoria Governamental:
  bloco: geral

Criminalística:
  bloco: geral
  nomes:
    - Noções de Criminalística

Administração Pública:
  bloco: geral

Administração Geral:
  bloco: geral

Administração Financeira e Orçamentária:
  bloco: geral
  nomes:
    - Noções de Administração Orçamentária e Financeira

Licitações e Contratos:
  bloco: geral

Ética e Integridade:
  bloco: geral
  nomes:
    - Ética e Compliance na Administração Pública e Legislação

# Legislação do órgão ou do setor fica separada por assunto: o conteúdo de cada uma não se compara.
# "Legislação" reúne o nome usado pela agsus (SUS e AgSUS) e pela infrasa (estatais e Infra S.A.).
Legislação:
  bloco: geral

Legislação de Telecomunicações:
  bloco: geral
  nomes:
    - Legislação Específica do Setor de Telecomunicações Brasileiro

Previdência Complementar:
  bloco: geral

# --- Bloco específico --------------------------------------------------------------------------

# Arquitetura, processos de desenvolvimento, testes, DevOps, ágil, orientação a objetos e linguagens.
Engenharia de Software:
  bloco: especifico
  nomes:
    - Desenvolvimento de Sistemas
    - Análise de Sistemas

Banco de Dados:
  bloco: especifico
  nomes:
    - Bancos de Dados

# BI, data warehouse, NoSQL, ETL e pipelines de dados.
Engenharia de Dados e BI:
  bloco: especifico
  nomes:
    - Inteligência de Negócios
    - Engenharia de Dados

# Aprendizado de máquina, IA, ciência de dados e estatística. "Tecnologia da Informação" da agsus é toda de
# ciência de dados (classificação, regressão, Python); a disciplina da Câmara mistura dados, estatística e
# ética digital (7 de 21 questões); o eixo 4 do CPNU é ciência de dados, big data e dados abertos.
Ciência de Dados e IA:
  bloco: especifico
  nomes:
    - Inteligência Artificial
    - Tecnologia da Informação
    - Tecnologia da Informação, Dados e Noçoes de Estatística
    - Eixo Temático 4 - Tecnologias da Informação e Comunicação (TICs) & Ciência de Dados

Segurança da Informação:
  bloco: especifico
  nomes:
    - Mitre ATT&CK, Cis

# "Análise e Desenvolvimento de Sistemas" é o nome do cargo na CPRM; os tópicos são de redes e servidores.
Infraestrutura e Redes:
  bloco: especifico
  nomes:
    - Infraestrutura de TI
    - Análise e Desenvolvimento de Sistemas

Computação em Nuvem:
  bloco: especifico

# ITIL, COBIT, gestão de projetos, processos, riscos e planejamento de TI.
Governança e Gestão de TI:
  bloco: especifico
  nomes:
    - Governança de TI
    - Gestão de Tecnologia da Informação

Contratações de TI:
  bloco: especifico
  nomes:
    - Fiscalização de Contratos de TI

Proteção de Dados e Privacidade:
  bloco: especifico

# Conhecimentos específicos do perito de informática da PF: fundamentos da computação, sistemas
# operacionais, bancos de dados, programação, segurança e computação forense.
Informática Forense:
  bloco: especifico
  nomes:
    - 'Cargo 4: Perito Criminal Federal – Área 3: Informática Forense'


